name: Verify Pennix Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python Skill tests
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              pacman -Syu --noconfirm python python-yaml bash zsh git tmux util-linux npm
              runuser -u nobody -- env HOME=/tmp bash -c "cd /workspace && find skills -path \"*/tests/test_*.py\" -type f -print0 | sort -z | xargs -0 -n1 python3 -B"
            '
      - name: Test native evaluation driver offline
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              pacman -Syu --noconfirm python python-yaml bash zsh git tmux util-linux
              runuser -u nobody -- env HOME=/tmp bash -c "cd /workspace && python3 -B evaluations/test_run_codex_cases.py"
            '
