name: Verify Pennix Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python Skill tests
        run: |
          find skills -path '*/tests/test_*.py' -type f -print0 \
            | sort -z \
            | xargs -0 -n1 python3
