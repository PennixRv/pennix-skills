name: Verify Pennix Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/fast-context/package-lock.json
      - name: Run Python Skill tests
        run: |
          find skills -path '*/tests/test_*.py' -type f -print0 \
            | sort -z \
            | xargs -0 -n1 python3
      - name: Validate collection source
        run: python3 skills/pennix-skills-install/scripts/install.py --source "$GITHUB_WORKSPACE" --check
      - name: Run Fast Context tests
        working-directory: skills/fast-context
        run: |
          npm ci
          npm test
