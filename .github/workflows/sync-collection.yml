name: Sync materialized Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize catalog sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/pennix-skill-sources.tsv"
          : > "$source_file"
          python3 - "$source_file" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/pennix-workflow-lifecycle/references/component-versions.json", encoding="utf-8"))
          contract = catalog["components"]["pennix-skills"]["collection_contract"]
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              for name, source in contract["materialized"].items():
                  print("\t".join((name, source["repo"], source["commit"], source["snapshot"])), file=output)
          PY

          while IFS=$'\t' read -r name repo commit snapshot; do
            test "${#commit}" -eq 40
            temporary="$RUNNER_TEMP/pennix-$name"
            git clone --quiet --no-checkout "https://github.com/$repo.git" "$temporary"
            git -C "$temporary" fetch --quiet --depth 1 origin "$commit"
            git -C "$temporary" checkout --quiet --detach "$commit"
            test "$(git -C "$temporary" rev-parse HEAD)" = "$commit"
            rm -rf -- "skills/$name"
            mkdir -p "skills/$name"
            if [[ "$snapshot" == "archive" ]]; then
              git -C "$temporary" archive HEAD | tar -x -C "skills/$name"
            elif [[ "$snapshot" == "npm-pack" ]]; then
              (
                cd "$temporary"
                npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pennix-$name-pack.json"
                node -e 'const pack = Object.values(require(process.argv[1]))[0]; for (const file of pack.files) process.stdout.write(`${file.path}\\0`)' "$RUNNER_TEMP/pennix-$name-pack.json" \
                  | tar --null --files-from=- -cf - \
                  | tar -xf - -C "$GITHUB_WORKSPACE/skills/$name"
              )
            else
              echo "unsupported snapshot mode: $snapshot" >&2
              exit 1
            fi
          done < "$source_file"

      - name: Validate collection
        run: |
          python3 -m unittest discover -s skills/pennix-workflow-lifecycle/tests -p 'test_*.py'
          python3 -m json.tool skills/pennix-workflow-lifecycle/references/component-versions.json >/dev/null
          (cd skills/grok-search && npm ci --omit=dev --ignore-scripts)

      - name: Open or update synchronization PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: sync materialized Skills"
          title: "chore: sync materialized Skills"
          body: "Automated catalog-driven synchronization of independent Skill source snapshots."
          branch: automation/sync-materialized-skills
          delete-branch: true
          base: main
