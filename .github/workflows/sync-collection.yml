name: Sync materialized Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize catalog sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/pennix-skill-sources.tsv"
          : > "$source_file"
          python3 - "$source_file" <<'PY'
          import json
          import sys

          catalog = json.load(open("skills/pennix-workflow-lifecycle/references/component-versions.json", encoding="utf-8"))
          contract = catalog["components"]["pennix-skills"]["collection_contract"]
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              for name, source in contract["materialized"].items():
                  print("\t".join((name, source["repo"], source["ref"], source["snapshot"])), file=output)
          PY

          while IFS=$'\t' read -r name repo ref snapshot; do
            sha="$(git ls-remote "https://github.com/$repo.git" "refs/heads/$ref" | awk 'NR == 1 { print $1 }')"
            test "${#sha}" -eq 40
            temporary="$RUNNER_TEMP/pennix-$name"
            git clone --quiet --depth 1 --branch "$ref" "https://github.com/$repo.git" "$temporary"
            test "$(git -C "$temporary" rev-parse HEAD)" = "$sha"
            rm -rf -- "skills/$name"
            mkdir -p "skills/$name"
            if [[ "$snapshot" == "archive" ]]; then
              git -C "$temporary" archive HEAD | tar -x -C "skills/$name"
            elif [[ "$snapshot" == "npm-pack" ]]; then
              (
                cd "$temporary"
                npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pennix-$name-pack.json"
                node -e 'const pack = Object.values(require(process.argv[1]))[0]; for (const file of pack.files) process.stdout.write(`${file.path}\\0`)' "$RUNNER_TEMP/pennix-$name-pack.json" \
                  | tar --null --files-from=- -cf - \
                  | tar -xf - -C "$GITHUB_WORKSPACE/skills/$name"
              )
            else
              echo "unsupported snapshot mode: $snapshot" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$name" "$sha" >> "$RUNNER_TEMP/pennix-skill-shas.tsv"
          done < "$source_file"

          python3 - "$RUNNER_TEMP/pennix-skill-shas.tsv" <<'PY'
          import json
          import sys

          path = "skills/pennix-workflow-lifecycle/references/component-versions.json"
          catalog = json.load(open(path, encoding="utf-8"))
          materialized = catalog["components"]["pennix-skills"]["collection_contract"]["materialized"]
          for line in open(sys.argv[1], encoding="utf-8"):
              name, sha = line.rstrip("\n").split("\t")
              materialized[name]["commit"] = sha
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Validate collection
        run: |
          python3 -m unittest discover -s skills/pennix-workflow-lifecycle/tests -p 'test_*.py'
          python3 -m json.tool skills/pennix-workflow-lifecycle/references/component-versions.json >/dev/null

      - name: Open or update synchronization PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: sync materialized Skills"
          title: "chore: sync materialized Skills"
          body: "Automated catalog-driven synchronization of independent Skill source snapshots."
          branch: automation/sync-materialized-skills
          delete-branch: true
          base: main
