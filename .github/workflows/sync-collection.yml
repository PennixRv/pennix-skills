name: Sync materialized Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read collection-owned sources
        run: python3 -c 'import json; print(json.dumps(json.load(open("collection.json"))["materialized"]))' > "$RUNNER_TEMP/sources.json"

      - name: Materialize fixed source commits
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name repo commit snapshot; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            source="$RUNNER_TEMP/source-$name"
            git init -q "$source"
            git -C "$source" remote add origin "https://github.com/$repo.git"
            git -C "$source" fetch -q --depth 1 origin "$commit"
            git -C "$source" checkout -q --detach FETCH_HEAD
            test "$(git -C "$source" rev-parse HEAD)" = "$commit"
            rm -rf -- "skills/$name"
            mkdir -p "skills/$name"
            if [[ "$snapshot" == archive ]]; then
              git -C "$source" archive "$commit" | tar -x -C "skills/$name"
            elif [[ "$snapshot" == npm-pack ]]; then
              (
                cd "$source"
                npm pack --ignore-scripts --json > "$RUNNER_TEMP/$name-pack.json"
                tarball="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["filename"])' "$RUNNER_TEMP/$name-pack.json")"
                tar -xzf "$tarball" --strip-components=1 -C "$GITHUB_WORKSPACE/skills/$name"
              )
            else
              echo "unsupported snapshot mode: $snapshot" >&2
              exit 1
            fi
          done < <(python3 - "$RUNNER_TEMP/sources.json" <<'PY'
          import json, sys
          for name, source in sorted(json.load(open(sys.argv[1])).items()):
              print("\t".join((name, source["repo"], source["commit"], source["snapshot"])))
          PY
          )

      - name: Verify manifest and Skills
        run: |
          python3 -m pip install --user pyyaml
          python3 scripts/collection.py verify
          python3 -B -m unittest discover -s tests -v
          while IFS= read -r test_dir; do
            python3 -B -m unittest discover -s "$test_dir" -p 'test_*.py'
          done < <(find skills -type f -path '*/tests/test_*.py' -printf '%h\n' | sort -u)
          (cd skills/pennix-grok-search && npm ci --omit=dev --ignore-scripts)

      - name: Open or update synchronization PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: sync materialized Skills"
          title: "chore: sync materialized Skills"
          body: "Materialize sources declared by collection.json, then validate the complete collection before review."
          branch: automation/sync-materialized-skills
          delete-branch: true
          base: main
